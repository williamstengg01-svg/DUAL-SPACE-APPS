plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace 'com.dualspace.clone'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"

    defaultConfig {
        applicationId "com.dualspace.clone"
        minSdk 26
        // targetSdk stays at 28 on purpose: app virtualization relies on behaviour that
        // Android restricts for apps targeting 29+ (background activity starts,
        // non-SDK interface access). Same value the engine itself uses.
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.2.7"

        vectorDrawables.useSupportLibrary = true
        resourceConfigurations += ["en", "in", "zh-rCN"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions += "abi"

    // A virtual app runs *inside* the host process, so the host ABI must match the
    // cloned app's native libraries. arm64 is the main build; arm32 is the companion
    // module offered to the user when they clone a 32-bit-only app.
    productFlavors {
        arm64 {
            dimension "abi"
            applicationId "com.dualspace.clone"
            ndk { abiFilters "arm64-v8a" }
            resValue "string", "app_name", "Dual Space"
        }
        arm32 {
            dimension "abi"
            applicationId "com.dualspace.clone32"
            ndk { abiFilters "armeabi-v7a" }
            resValue "string", "app_name", "Dual Space 32-bit"
        }
    }

    signingConfigs {
        release {
            // Populated by CI (see .github/workflows/build.yml) or by keystore/keystore.properties.
            def propsFile = rootProject.file("keystore/keystore.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file("keystore/" + props['storeFile'])
                // PKCS12 is what both `keytool` (JDK 9+) and OpenSSL produce; a JKS file
                // still loads through the JDK's compatibility mode.
                storeType props['storeType'] ?: 'PKCS12'
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            // The engine relies heavily on reflection; keep shrinking off for the host app.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file("keystore/keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes.add("**/libandroidx.graphics.path.so")
        }
        resources {
            excludes.add("**/libandroidx.graphics.path.so")
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(':Bcore')

    // Only AndroidX + Material. No advertising, analytics or tracking SDKs — by design.
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation libs.junit
    // Local JVM unit tests run against the Android stub jar, whose org.json classes
    // throw RuntimeException("Stub!") for every real method. Clone.toJson/fromJson need
    // actual JSON parsing, so pull in the reference implementation for the test classpath only.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation libs.ext.junit
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
