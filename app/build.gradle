plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 33
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.dualspace.clone"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        vectorDrawables.useSupportLibrary = true
        resConfigs "en", "in", "zh-rCN"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "abi"

    // A virtual app runs *inside* the host process, so the host ABI must match the
    // cloned app's native libraries. arm64 is the main build; arm32 is the companion
    // module offered to the user when they clone a 32-bit-only app.
    productFlavors {
        arm64 {
            dimension "abi"
            applicationId "com.dualspace.clone"
            ndk { abiFilters "arm64-v8a" }
            resValue "string", "app_name", "Dual Space"
        }
        arm32 {
            dimension "abi"
            applicationId "com.dualspace.clone32"
            ndk { abiFilters "armeabi-v7a" }
            resValue "string", "app_name", "Dual Space 32-bit"
        }
    }

    signingConfigs {
        release {
            // Populated by CI (see .github/workflows/build.yml) or by keystore/keystore.properties.
            def propsFile = rootProject.file("keystore/keystore.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file("keystore/" + props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            // The engine relies heavily on reflection; keep shrinking off.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file("keystore/keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(':Bcore')

    // Only AndroidX + Material. No advertising, analytics or tracking SDKs — by design.
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.0'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    testImplementation 'junit:junit:4.13.2'
    // Local JVM unit tests run against the Android stub jar, whose org.json classes
    // throw RuntimeException("Stub!") for every real method. Clone.toJson/fromJson
    // (app/src/main/java/com/dualspace/clone/model/Clone.kt) need actual JSON parsing,
    // so pull in the real reference implementation for the test classpath only.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
