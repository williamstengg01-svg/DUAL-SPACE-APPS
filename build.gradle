// Dual Space — root build script
buildscript {
    ext.kotlin_version = "1.7.10"
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.4.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    // Engine modules (Bcore, android-mirror) compile against API 30 — they mirror hidden framework APIs.
    compileSdkVersion = 30
    buildToolsVersion = "30.0.3"
    // targetSdk stays at 28 on purpose: app virtualization relies on behaviour that Android
    // restricts for apps targeting 29+ (background activity starts, non-SDK interface access).
    targetSdkVersion = 28
    ndkVersion = "21.4.7075529"

    versionName = '1.0.0'
    versionCode = 1

    blackReflection = '1.1.2'
}
